name: SonarQube with OpenCover

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Build and Analyze with Coverage
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: powershell
      run: |
        # Adiciona o SonarScanner ao PATH
        $env:PATH += ";$env:USERPROFILE\.dotnet\tools"

        # Inicia a análise
        dotnet sonarscanner begin `
          /k:"MateusLeonardo_Cadidatus" `
          /o:"mateusleonardo" `
          /d:sonar.token="$env:SONAR_TOKEN" `
          /d:sonar.host.url="https://sonarcloud.io" `
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
          /d:sonar.exclusions="**/bin/**,**/obj/**"

        # Build do projeto principal
        dotnet build Candidatus.sln -c Release

        # Roda os testes e gera o relatório de cobertura
        dotnet test tests/UseCases.Test/UseCases.Test.csproj -c Release --no-build `
          /p:CollectCoverage=true `
          /p:CoverletOutputFormat=opencover `
          /p:CoverletOutput=../TestResults/UseCases.coverage.opencover.xml

        dotnet test tests/Validators.Test/Validators.Test.csproj -c Release --no-build `
          /p:CollectCoverage=true `
          /p:CoverletOutputFormat=opencover `
          /p:MergeWith=../TestResults/UseCases.coverage.opencover.xml `
          /p:CoverletOutput=../TestResults/Validators.coverage.opencover.xml

        dotnet test tests/WebApi.Test/WebApi.Test.csproj -c Release --no-build `
          /p:CollectCoverage=true `
          /p:CoverletOutputFormat=opencover `
          /p:MergeWith=../TestResults/Validators.coverage.opencover.xml `
          /p:CoverletOutput=../TestResults/WebApi.coverage.opencover.xml

        # Finaliza a análise
        dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
