name: SonarQube with OpenCover

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Build and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: powershell
      run: |
        $env:PATH += ";$env:USERPROFILE\.dotnet\tools"

        # Iniciar análise com suporte a cobertura
        dotnet sonarscanner begin `
          /k:"MateusLeonardo_Cadidatus" `
          /o:"mateusleonardo" `
          /d:sonar.token="$env:SONAR_TOKEN" `
          /d:sonar.host.url="https://sonarcloud.io" `
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
          /d:sonar.exclusions="**/bin/**,**/obj/**"

        # Build completo da solução
        dotnet build Candidatus.sln -c Release

        # Roda todos os testes automaticamente com cobertura
        dotnet test Candidatus.sln -c Release --no-build `
          /p:CollectCoverage=true `
          /p:CoverletOutputFormat=opencover `
          /p:CoverletOutput=./TestResults/coverage.opencover.xml

        # Finalizar análise
        dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
