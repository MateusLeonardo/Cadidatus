name: SonarQube with OpenCover

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Install OpenCover (se necessário)
      shell: powershell
      run: |
        choco install opencover.portable -y

    - name: Build and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: powershell
      run: |
        # Iniciar análise sem configuração de coverage inicial
        dotnet sonarscanner begin /k:"MateusLeonardo_Cadidatus" /o:"mateusleonardo" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io"
        
        # Build
        dotnet build -c Release
        
        # Testes sem cobertura inicialmente
        dotnet test -c Release --logger trx
        
        # Finalizar análise
        dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"